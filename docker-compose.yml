services:
  games:
    image: ${IMAGE_NAME:-dockerregistry.simon-wick.ch/games-landingpage}:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      PORT: 5000
      MAX_CLIENTS: 150
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    external: true
